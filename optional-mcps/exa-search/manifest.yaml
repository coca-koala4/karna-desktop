manifest_version: 2
name: exa-search
description: 基于Exa的高质量网络搜索MCP服务器
source: https://www.mcp-cn.com/server/77
transport:
  type: stdio
  command: npx
  args:
  - -y
  - exa-mcp-server
auth:
  type: api_key
  env:
  - name: EXA_SEARCH_API_KEY
    prompt: exa-search API Key
    required: true
    secret: true
post_install: 'exa-search MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: exa-search
version: unresolved
dependencies:
  runtime: npm
  package: exa-mcp-server
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
