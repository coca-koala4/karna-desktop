manifest_version: 2
name: airbnb
description: Airbnb MCP服务器，提供Airbnb房源搜索和获取房源详情功能
source: https://www.mcp-cn.com/server/117
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@openbnb/mcp-server-airbnb'
auth:
  type: none
post_install: 'airbnb MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: airbnb
version: unresolved
dependencies:
  runtime: npm
  package: '@openbnb/mcp-server-airbnb'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
