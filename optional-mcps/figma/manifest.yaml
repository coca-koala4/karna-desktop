manifest_version: 2
name: figma
description: 连接Figma的MCP服务器，支持设计文件管理和操作
source: https://www.mcp-cn.com/server/70
transport:
  type: stdio
  command: npx
  args:
  - -y
  - figma-developer-mcp
auth:
  type: api_key
  env:
  - name: FIGMA_API_KEY
    prompt: figma API Key
    required: true
    secret: true
post_install: 'figma MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: figma
version: unresolved
dependencies:
  runtime: npm
  package: figma-developer-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
