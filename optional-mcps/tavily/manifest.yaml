manifest_version: 2
name: tavily
description: 基于Tavily的智能搜索MCP服务器，提供高质量的网络搜索结果
source: https://www.mcp-cn.com/server/87
transport:
  type: stdio
  command: npx
  args:
  - -y
  - tavily-mcp
auth:
  type: api_key
  env:
  - name: TAVILY_API_KEY
    prompt: tavily API Key
    required: true
    secret: true
post_install: 'tavily MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: tavily
version: unresolved
dependencies:
  runtime: npm
  package: tavily-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
