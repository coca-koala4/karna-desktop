manifest_version: 2
name: xcodebuild
description: Xcode项目构建和管理的MCP工具
source: https://www.mcp-cn.com/server/78
transport:
  type: stdio
  command: npx
  args:
  - -y
  - xcodebuildmcp
auth:
  type: none
post_install: 'xcodebuild MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: xcodebuild
version: unresolved
dependencies:
  runtime: npm
  package: xcodebuildmcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
