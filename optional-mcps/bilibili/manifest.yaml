manifest_version: 2
name: bilibili
description: Bilibili的MCP服务器，支持Bilibili的内容搜索
source: https://www.mcp-cn.com/server/108
transport:
  type: stdio
  command: npx
  args:
  - -y
  - bilibili-mcp
auth:
  type: none
post_install: 'bilibili MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: bilibili
version: unresolved
dependencies:
  runtime: npm
  package: bilibili-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
