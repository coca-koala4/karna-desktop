manifest_version: 2
name: deepwiki
description: 非官方的DeepWiki MCP服务器，通过MCP接收DeepWiki URL，爬取所有相关页面并转换为Markdown格式
source: https://www.mcp-cn.com/server/116
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mcp-deepwiki
auth:
  type: none
post_install: 'deepwiki MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: deepwiki
version: unresolved
dependencies:
  runtime: npm
  package: mcp-deepwiki
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
