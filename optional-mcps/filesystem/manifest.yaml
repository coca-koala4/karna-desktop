manifest_version: 2
name: filesystem
description: 文件系统操作的MCP服务器
source: https://www.mcp-cn.com/server/79
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-filesystem'
auth:
  type: none
post_install: 'filesystem MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: filesystem
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-filesystem'
permissions:
- filesystem:read
- filesystem:write
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
