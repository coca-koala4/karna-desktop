manifest_version: 2
name: brave-search
description: 基于Brave搜索引擎的MCP服务器，提供安全、私密的搜索服务
source: https://www.mcp-cn.com/server/84
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-brave-search'
auth:
  type: api_key
  env:
  - name: BRAVE_SEARCH_API_KEY
    prompt: brave-search API Key
    required: true
    secret: true
post_install: 'brave-search MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: brave-search
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-brave-search'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
