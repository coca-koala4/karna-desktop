manifest_version: 2
name: unreal-engine
description: Drive the Unreal Engine 5.8 editor over its local MCP server.
source: https://dev.epicgames.com/documentation/unreal-engine/unreal-mcp-in-unreal-editor
transport:
  type: http
  url: http://127.0.0.1:8000/mcp
auth:
  type: none
post_install: "This entry connects to Epic's official Unreal MCP plugin, which runs\
  \ INSIDE\nthe Unreal Editor. Before Hermes can connect:\n\n  1. Open your project\
  \ in Unreal Editor 5.8+.\n  2. Edit > Plugins, search \"Unreal MCP\", enable it,\
  \ restart the editor\n     (the Toolset Registry dependency enables automatically).\n\
  \  3. Edit > Editor Preferences > General > Model Context Protocol, turn on\n  \
  \   \"Auto Start Server\" (or run `ModelContextProtocol.StartServer` in the\n  \
  \   editor console). It binds to http://127.0.0.1:8000/mcp by default.\n\nStart\
  \ Hermes AFTER the editor's server is running so the tools are probed.\nIf you changed\
  \ the port or URL path in Editor Preferences, update the url in\nmcp_servers.unreal-engine\
  \ to match.\n\nStatus: Epic ships this as EXPERIMENTAL. The server runs Tool calls\
  \ serially\non the engine game thread — avoid issuing overlapping calls.\n\nRe-run\
  \ the tool checklist any time with:\n  hermes mcp configure unreal-engine\n"
id: unreal-engine
version: unresolved
dependencies:
  runtime: external
  package: unresolved
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
