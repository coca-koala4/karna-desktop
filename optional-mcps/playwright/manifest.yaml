manifest_version: 2
name: playwright
description: 基于Playwright的自动化测试和网页操作MCP工具
source: https://www.mcp-cn.com/server/64
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@playwright/mcp'
auth:
  type: none
post_install: 'playwright MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: playwright
version: unresolved
dependencies:
  runtime: npm
  package: '@playwright/mcp'
permissions:
- network:outbound
- browser:control
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
