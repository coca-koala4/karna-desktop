manifest_version: 2
name: edgeone-pages
description: Tencent EdgeOne Pages的MCP服务器，支持页面管理和部署
source: https://www.mcp-cn.com/server/93
transport:
  type: stdio
  command: npx
  args:
  - -y
  - edgeone-pages-mcp
auth:
  type: api_key
  env:
  - name: EDGEONE_PAGES_API_KEY
    prompt: edgeone-pages API Key
    required: true
    secret: true
post_install: 'edgeone-pages MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: edgeone-pages
version: unresolved
dependencies:
  runtime: npm
  package: edgeone-pages-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
