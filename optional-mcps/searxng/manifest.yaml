manifest_version: 2
name: searxng
description: 通过模型上下文协议(MCP)集成SearXNG搜索引擎的服务器，提供隐私保护的网络搜索功能
source: https://www.mcp-cn.com/server/120
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mcp-searxng
auth:
  type: api_key
  env:
  - name: SEARXNG_API_KEY
    prompt: searxng API Key
    required: true
    secret: true
post_install: 'searxng MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: searxng
version: unresolved
dependencies:
  runtime: npm
  package: mcp-searxng
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
