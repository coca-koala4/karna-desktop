manifest_version: 2
name: amap
description: 高德地图的MCP服务器
source: https://www.mcp-cn.com/server/82
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@amap/amap-maps-mcp-server'
auth:
  type: api_key
  env:
  - name: AMAP_API_KEY
    prompt: amap API Key
    required: true
    secret: true
post_install: 'amap MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: amap
version: unresolved
dependencies:
  runtime: npm
  package: '@amap/amap-maps-mcp-server'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
