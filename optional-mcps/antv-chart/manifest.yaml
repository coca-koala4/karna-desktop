manifest_version: 2
name: antv-chart
description: 基于AntV的图表生成MCP工具，支持多种图表类型的创建和渲染
source: https://www.mcp-cn.com/server/103
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@antv/mcp-server-chart'
auth:
  type: none
post_install: 'antv-chart MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: antv-chart
version: unresolved
dependencies:
  runtime: npm
  package: '@antv/mcp-server-chart'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
