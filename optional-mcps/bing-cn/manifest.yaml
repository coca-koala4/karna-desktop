manifest_version: 2
name: bing-cn
description: 一个基于MCP的中文必应搜索工具，可以直接通过Claude或其他支持MCP的AI来搜索必应并获取网页内容
source: https://www.mcp-cn.com/server/126
transport:
  type: stdio
  command: npx
  args:
  - -y
  - bing-cn-mcp
auth:
  type: none
post_install: 'bing-cn MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: bing-cn
version: unresolved
dependencies:
  runtime: npm
  package: bing-cn-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
