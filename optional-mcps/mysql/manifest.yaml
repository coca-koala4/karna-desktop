manifest_version: 2
name: mysql
description: MySQL数据库的MCP服务器，支持数据库操作和管理
source: https://www.mcp-cn.com/server/90
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@benborla29/mcp-server-mysql'
auth:
  type: api_key
  env:
  - name: MYSQL_API_KEY
    prompt: mysql API Key
    required: true
    secret: true
post_install: 'mysql MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: mysql
version: unresolved
dependencies:
  runtime: npm
  package: '@benborla29/mcp-server-mysql'
permissions:
- network:outbound
- database:read
- database:write
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
