manifest_version: 2
name: weread
description: 微信读书的MCP服务器，支持微信读书的读取和写入
source: https://www.mcp-cn.com/server/110
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mcp-server-weread
auth:
  type: api_key
  env:
  - name: WEREAD_API_KEY
    prompt: weread API Key
    required: true
    secret: true
post_install: 'weread MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: weread
version: unresolved
dependencies:
  runtime: npm
  package: mcp-server-weread
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
