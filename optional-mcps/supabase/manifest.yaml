manifest_version: 2
name: supabase
description: 连接Supabase数据库的MCP服务器，支持数据管理和查询
source: https://www.mcp-cn.com/server/22
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@supabase/mcp-server-supabase'
auth:
  type: api_key
  env:
  - name: SUPABASE_API_KEY
    prompt: supabase API Key
    required: true
    secret: true
post_install: 'supabase MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: supabase
version: unresolved
dependencies:
  runtime: npm
  package: '@supabase/mcp-server-supabase'
permissions:
- network:outbound
- database:read
- database:write
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
