manifest_version: 2
name: kubernetes
description: Kubernetes的MCP服务器，支持Kubernetes的读取和写入
source: https://www.mcp-cn.com/server/97
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mcp-server-kubernetes
auth:
  type: api_key
  env:
  - name: KUBERNETES_API_KEY
    prompt: kubernetes API Key
    required: true
    secret: true
post_install: 'kubernetes MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: kubernetes
version: unresolved
dependencies:
  runtime: npm
  package: mcp-server-kubernetes
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
