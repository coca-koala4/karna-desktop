manifest_version: 2
name: hotnews
description: HotNews的MCP服务器，支持国内热点新闻的读取
source: https://www.mcp-cn.com/server/99
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@wopal/mcp-server-hotnews'
auth:
  type: none
post_install: 'hotnews MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: hotnews
version: unresolved
dependencies:
  runtime: npm
  package: '@wopal/mcp-server-hotnews'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
