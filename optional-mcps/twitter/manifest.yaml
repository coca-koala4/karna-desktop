manifest_version: 2
name: twitter
description: Twitter MCP服务器允许客户端与Twitter进行交互，支持发布推文和搜索Twitter内容
source: https://www.mcp-cn.com/server/123
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@enescinar/twitter-mcp'
auth:
  type: api_key
  env:
  - name: TWITTER_API_KEY
    prompt: twitter API Key
    required: true
    secret: true
post_install: 'twitter MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: twitter
version: unresolved
dependencies:
  runtime: npm
  package: '@enescinar/twitter-mcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
