manifest_version: 2
name: everything
description: MCP协议功能测试服务器，展示MCP的所有功能特性
source: https://www.mcp-cn.com/server/115
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-everything'
auth:
  type: none
post_install: 'everything MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: everything
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-everything'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
