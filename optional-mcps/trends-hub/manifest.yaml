manifest_version: 2
name: trends-hub
description: 基于MCP协议的全网热点趋势一站式聚合服务，支持多平台热点数据获取、趋势分析和内容聚合
source: https://www.mcp-cn.com/server/124
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mcp-trends-hub
auth:
  type: none
post_install: 'trends-hub MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: trends-hub
version: unresolved
dependencies:
  runtime: npm
  package: mcp-trends-hub
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
