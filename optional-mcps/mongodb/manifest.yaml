manifest_version: 2
name: mongodb
description: MongoDB的MCP服务器，支持MongoDB的读取和写入
source: https://www.mcp-cn.com/server/95
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mongodb-mcp-server
auth:
  type: api_key
  env:
  - name: MONGODB_API_KEY
    prompt: mongodb API Key
    required: true
    secret: true
post_install: 'mongodb MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: mongodb
version: unresolved
dependencies:
  runtime: npm
  package: mongodb-mcp-server
permissions:
- network:outbound
- database:read
- database:write
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
