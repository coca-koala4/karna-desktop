manifest_version: 2
name: apple
description: Apple生态系统集成的MCP工具
source: https://www.mcp-cn.com/server/76
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@dhravya/apple-mcp'
auth:
  type: none
post_install: 'apple MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: apple
version: unresolved
dependencies:
  runtime: npm
  package: '@dhravya/apple-mcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
