manifest_version: 2
name: desktop-commander
description: 桌面自动化和系统操作的MCP工具
source: https://www.mcp-cn.com/server/71
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@wonderwhy-er/desktop-commander'
auth:
  type: none
post_install: 'desktop-commander MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: desktop-commander
version: unresolved
dependencies:
  runtime: npm
  package: '@wonderwhy-er/desktop-commander'
permissions:
- filesystem:read
- filesystem:write
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
