manifest_version: 2
name: mastra
description: mastra MCP服务器，支持mastra.ai生态
source: https://www.mcp-cn.com/server/89
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@mastra/mcp-docs-server'
auth:
  type: none
post_install: 'mastra MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: mastra
version: unresolved
dependencies:
  runtime: npm
  package: '@mastra/mcp-docs-server'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
