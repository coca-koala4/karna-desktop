manifest_version: 2
name: elasticsearch
description: 通过模型上下文协议(MCP)连接Elasticsearch数据的实验性服务器
source: https://www.mcp-cn.com/server/118
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@elastic/mcp-server-elasticsearch'
auth:
  type: api_key
  env:
  - name: ELASTICSEARCH_API_KEY
    prompt: elasticsearch API Key
    required: true
    secret: true
post_install: 'elasticsearch MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: elasticsearch
version: unresolved
dependencies:
  runtime: npm
  package: '@elastic/mcp-server-elasticsearch'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
