manifest_version: 2
name: postgres
description: PostgreSQL的MCP服务器，支持PostgreSQL的读取和写入
source: https://www.mcp-cn.com/server/83
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-postgres'
auth:
  type: api_key
  env:
  - name: POSTGRES_API_KEY
    prompt: postgres API Key
    required: true
    secret: true
post_install: 'postgres MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: postgres
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-postgres'
permissions:
- network:outbound
- database:read
- database:write
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
