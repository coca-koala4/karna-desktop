manifest_version: 2
name: browser-mcp
description: 浏览器自动化集成的MCP服务器，支持操纵浏览器
source: https://www.mcp-cn.com/server/75
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@browsermcp/mcp'
auth:
  type: none
post_install: 'browser-mcp MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: browser-mcp
version: unresolved
dependencies:
  runtime: npm
  package: '@browsermcp/mcp'
permissions:
- network:outbound
- browser:control
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
