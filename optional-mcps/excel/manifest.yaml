manifest_version: 2
name: excel
description: Excel文件的MCP服务器，支持Excel文件的读取和写入
source: https://www.mcp-cn.com/server/88
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@negokaz/excel-mcp-server'
auth:
  type: none
post_install: 'excel MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: excel
version: unresolved
dependencies:
  runtime: npm
  package: '@negokaz/excel-mcp-server'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
