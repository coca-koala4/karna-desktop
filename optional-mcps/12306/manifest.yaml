manifest_version: 2
name: '12306'
description: 12306的MCP服务器，支持12306的读取
source: https://www.mcp-cn.com/server/102
transport:
  type: stdio
  command: npx
  args:
  - -y
  - 12306-mcp
auth:
  type: none
post_install: '12306 MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: '12306'
version: unresolved
dependencies:
  runtime: npm
  package: 12306-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
