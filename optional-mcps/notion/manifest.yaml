manifest_version: 2
name: notion
description: 连接Notion的MCP服务器，支持页面管理和数据操作
source: https://www.mcp-cn.com/server/65
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-notion'
auth:
  type: api_key
  env:
  - name: NOTION_API_KEY
    prompt: notion API Key
    required: true
    secret: true
post_install: 'notion MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: notion
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-notion'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
