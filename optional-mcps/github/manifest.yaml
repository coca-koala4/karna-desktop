manifest_version: 2
name: github
description: 连接GitHub的MCP服务器，支持仓库管理、问题跟踪、代码搜索等功能
source: https://www.mcp-cn.com/server/62
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-github'
auth:
  type: api_key
  env:
  - name: GITHUB_API_KEY
    prompt: github API Key
    required: true
    secret: true
post_install: 'github MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: github
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-github'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
