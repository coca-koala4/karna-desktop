manifest_version: 2
name: sequential-thinking
description: 帮助AI进行结构化思考和推理的MCP工具
source: https://www.mcp-cn.com/server/63
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-sequential-thinking'
auth:
  type: none
post_install: 'sequential-thinking MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: sequential-thinking
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-sequential-thinking'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
