manifest_version: 2
name: apifox
description: Apifox的MCP服务器，支持Apifox的读取和写入
source: https://www.mcp-cn.com/server/109
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@wangmhaha/apifox-mcp-server'
auth:
  type: api_key
  env:
  - name: APIFOX_API_KEY
    prompt: apifox API Key
    required: true
    secret: true
post_install: 'apifox MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: apifox
version: unresolved
dependencies:
  runtime: npm
  package: '@wangmhaha/apifox-mcp-server'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
