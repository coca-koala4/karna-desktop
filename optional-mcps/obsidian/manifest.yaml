manifest_version: 2
name: obsidian
description: Obsidian的MCP服务器，支持Obsidian的读取和写入
source: https://www.mcp-cn.com/server/101
transport:
  type: stdio
  command: npx
  args:
  - -y
  - mcp-obsidian
auth:
  type: api_key
  env:
  - name: OBSIDIAN_API_KEY
    prompt: obsidian API Key
    required: true
    secret: true
post_install: 'obsidian MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: obsidian
version: unresolved
dependencies:
  runtime: npm
  package: mcp-obsidian
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
