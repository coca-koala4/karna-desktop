manifest_version: 2
name: leetcode
description: LeetCode的MCP服务器，支持LeetCode的读取和写入
source: https://www.mcp-cn.com/server/107
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@jinzcdev/leetcode-mcp-server'
auth:
  type: api_key
  env:
  - name: LEETCODE_API_KEY
    prompt: leetcode API Key
    required: true
    secret: true
post_install: 'leetcode MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: leetcode
version: unresolved
dependencies:
  runtime: npm
  package: '@jinzcdev/leetcode-mcp-server'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
