manifest_version: 2
name: slack
description: 连接Slack的MCP服务器，支持消息发送、频道管理和工作流自动化
source: https://www.mcp-cn.com/server/86
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-slack'
auth:
  type: api_key
  env:
  - name: SLACK_API_KEY
    prompt: slack API Key
    required: true
    secret: true
post_install: 'slack MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: slack
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-slack'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
