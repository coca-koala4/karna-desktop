manifest_version: 2
name: linear
description: Find, create, and update Linear issues, projects, and comments.
source: https://linear.app/docs/mcp
transport:
  type: http
  url: https://mcp.linear.app/mcp
auth:
  type: oauth
post_install: "On first connection, Hermes will open a browser to authenticate with\
  \ Linear.\nAfter auth, restart your Hermes session so the Linear tools are loaded.\n\
  \nYou can re-run the tool checklist any time with:\n  hermes mcp configure linear\n"
id: linear
version: unresolved
dependencies:
  runtime: external
  package: unresolved
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
