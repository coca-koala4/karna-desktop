manifest_version: 2
name: cloudflare
description: 连接Cloudflare服务的MCP服务器，支持DNS和CDN管理
source: https://www.mcp-cn.com/server/72
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@cloudflare/mcp-server-cloudflare'
auth:
  type: api_key
  env:
  - name: CLOUDFLARE_API_KEY
    prompt: cloudflare API Key
    required: true
    secret: true
post_install: 'cloudflare MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: cloudflare
version: unresolved
dependencies:
  runtime: npm
  package: '@cloudflare/mcp-server-cloudflare'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
