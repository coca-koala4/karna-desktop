manifest_version: 2
name: task-master
description: 智能任务管理和自动化的MCP工具
source: https://www.mcp-cn.com/server/81
transport:
  type: stdio
  command: npx
  args:
  - -y
  - task-master-ai
auth:
  type: none
post_install: 'task-master MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: task-master
version: unresolved
dependencies:
  runtime: npm
  package: task-master-ai
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
