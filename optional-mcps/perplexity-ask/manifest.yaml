manifest_version: 2
name: perplexity-ask
description: Perplexity Ask的MCP服务器，支持Perplexity Ask的读取
source: https://www.mcp-cn.com/server/100
transport:
  type: stdio
  command: npx
  args:
  - -y
  - server-perplexity-ask
auth:
  type: api_key
  env:
  - name: PERPLEXITY_ASK_API_KEY
    prompt: perplexity-ask API Key
    required: true
    secret: true
post_install: 'perplexity-ask MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: perplexity-ask
version: unresolved
dependencies:
  runtime: npm
  package: server-perplexity-ask
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
