manifest_version: 2
name: whois
description: WHOIS MCP服务允许AI代理执行WHOIS查询并检索域名详细信息
source: https://www.mcp-cn.com/server/134
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@bharathvaj/whois-mcp'
auth:
  type: none
post_install: 'whois MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: whois
version: unresolved
dependencies:
  runtime: npm
  package: '@bharathvaj/whois-mcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
