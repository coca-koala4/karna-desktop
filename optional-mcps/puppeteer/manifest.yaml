manifest_version: 2
name: puppeteer
description: 基于Puppeteer的网页自动化和数据抓取MCP工具
source: https://www.mcp-cn.com/server/80
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-puppeteer'
auth:
  type: none
post_install: 'puppeteer MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: puppeteer
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-puppeteer'
permissions:
- network:outbound
- browser:control
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
