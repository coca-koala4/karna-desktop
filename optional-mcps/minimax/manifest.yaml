manifest_version: 2
name: minimax
description: MiniMax MCP服务器，提供图像生成、视频生成、文本转语音等多种AI功能
source: https://www.mcp-cn.com/server/114
transport:
  type: stdio
  command: npx
  args:
  - -y
  - minimax-mcp
auth:
  type: api_key
  env:
  - name: MINIMAX_API_KEY
    prompt: minimax API Key
    required: true
    secret: true
post_install: 'minimax MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: minimax
version: unresolved
dependencies:
  runtime: npm
  package: minimax-mcp
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
