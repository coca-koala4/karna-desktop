manifest_version: 2
name: gmail-autoauth
description: Gmail AutoAuth的MCP服务器，支持Gmail AutoAuth的读取和写入
source: https://www.mcp-cn.com/server/112
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@gongrzhe/server-gmail-autoauth-mcp'
auth:
  type: oauth
post_install: 'gmail-autoauth MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: gmail-autoauth
version: unresolved
dependencies:
  runtime: npm
  package: '@gongrzhe/server-gmail-autoauth-mcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
