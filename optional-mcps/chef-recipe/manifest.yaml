manifest_version: 2
name: chef-recipe
description: Chef Recipe的MCP服务器，支持菜谱搜索和食谱管理
source: https://www.mcp-cn.com/server/113
transport:
  type: stdio
  command: npx
  args:
  - -y
  - chef-recipe-mcp-server
auth:
  type: none
post_install: 'chef-recipe MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: chef-recipe
version: unresolved
dependencies:
  runtime: npm
  package: chef-recipe-mcp-server
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
