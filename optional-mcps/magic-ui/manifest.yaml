manifest_version: 2
name: magic-ui
description: 多功能AI辅助工具的MCP服务器
source: https://www.mcp-cn.com/server/73
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@21st-dev/magic'
auth:
  type: none
post_install: 'magic-ui MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: magic-ui
version: unresolved
dependencies:
  runtime: npm
  package: '@21st-dev/magic'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
