manifest_version: 2
name: metamcp
description: MetaMCP是一个代理服务器，将多个MCP服务器整合为一个
source: https://www.mcp-cn.com/server/121
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@metamcp/mcp-server-metamcp'
auth:
  type: none
post_install: 'metamcp MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: metamcp
version: unresolved
dependencies:
  runtime: npm
  package: '@metamcp/mcp-server-metamcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
