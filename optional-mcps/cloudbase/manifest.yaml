manifest_version: 2
name: cloudbase
description: 基于MCP协议的AI编程助手一键部署服务，支持在Cursor/VSCode等AI编程工具中自动生成前后端应用+小程序
source: https://www.mcp-cn.com/server/125
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@cloudbase/cloudbase-mcp'
auth:
  type: api_key
  env:
  - name: CLOUDBASE_API_KEY
    prompt: cloudbase API Key
    required: true
    secret: true
post_install: 'cloudbase MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: cloudbase
version: unresolved
dependencies:
  runtime: npm
  package: '@cloudbase/cloudbase-mcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
