manifest_version: 2
name: alipay
description: 支付宝开放平台提供的MCP Server，让你可以轻松将支付宝开放平台提供的交易创建、查询、退款等能力集成到你的LLM应用中
source: https://www.mcp-cn.com/server/127
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@alipay/mcp-server-alipay'
auth:
  type: api_key
  env:
  - name: ALIPAY_API_KEY
    prompt: alipay API Key
    required: true
    secret: true
post_install: 'alipay MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: alipay
version: unresolved
dependencies:
  runtime: npm
  package: '@alipay/mcp-server-alipay'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
