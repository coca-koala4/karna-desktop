manifest_version: 2
name: context7
description: 基于Upstash的向量搜索和上下文管理MCP服务
source: https://www.mcp-cn.com/server/67
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@upstash/context7-mcp'
auth:
  type: api_key
  env:
  - name: CONTEXT7_API_KEY
    prompt: context7 API Key
    required: true
    secret: true
post_install: 'context7 MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: context7
version: unresolved
dependencies:
  runtime: npm
  package: '@upstash/context7-mcp'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
