manifest_version: 2
name: memory
description: 提供内存管理和数据缓存的MCP服务器
source: https://www.mcp-cn.com/server/85
transport:
  type: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-memory'
auth:
  type: none
post_install: 'memory MCP 已安装。启动新会话以加载工具。

  如需 API Key，请配置环境变量。

  '
id: memory
version: unresolved
dependencies:
  runtime: npm
  package: '@modelcontextprotocol/server-memory'
permissions:
- network:outbound
health_check:
  type: mcp_initialize
  timeout_ms: 10000
lifecycle:
  status: active
  deprecated: false
