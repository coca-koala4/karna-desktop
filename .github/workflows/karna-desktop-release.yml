name: Karna Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stable:
        description: 'Publish as a stable release (requires signing certificate)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require a signing certificate for stable releases
        if: ${{ inputs.stable == true }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw 'Stable releases require WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD secrets.'
          }

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match desktop version v$version" }

      - run: npm ci
      - run: node apps/desktop/electron/karna-branding.test.cjs
      - run: node apps/desktop/electron/karna/paths.test.cjs
      - run: node --test apps/desktop/electron/desktop-preferences.test.cjs apps/desktop/electron/release-updater.test.cjs apps/desktop/electron/karna/builtin-resources.test.cjs apps/desktop/scripts/verify-release-contents.test.cjs
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop run test:contracts
      - run: npm --prefix apps/desktop run build
      - name: Build NSIS update artifacts
        run: npm --prefix apps/desktop run builder -- --win nsis --x64 --publish never

      - name: Create checksums and release inventory
        shell: pwsh
        run: |
          $release = Resolve-Path apps/desktop/release
          Get-ChildItem $release -File | Where-Object { $_.Extension -in '.exe','.yml','.blockmap' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$release/SHA256SUMS.txt" -Encoding utf8
          Copy-Item apps/desktop/build/release-manifest.json "$release/release-manifest.json"

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$((Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version)-manual-$env:GITHUB_RUN_NUMBER" }
          $mode = if ('${{ inputs.stable }}' -eq 'true') { @() } else { @('--prerelease') }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag @mode --title "Karna $tag" --generate-notes }
          gh release upload $tag apps/desktop/release/*.exe apps/desktop/release/*.yml apps/desktop/release/*.blockmap apps/desktop/release/SHA256SUMS.txt apps/desktop/release/release-manifest.json --clobber
